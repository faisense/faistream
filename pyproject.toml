[project]
name = "faistream"
version = "0.1.0"
description = "Decode a camera once, share it with many consumers: low-latency pub/sub frame streaming over shared memory and ZeroMQ."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["video", "streaming", "rtsp", "zeromq", "shared-memory", "computer-vision", "edge"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Video",
]
# OpenCV is deliberately optional: edge devices (Jetson, Raspberry Pi) often ship
# a system OpenCV with hardware decoding that a pip wheel would shadow, and
# subscribers reading raw/shared-memory frames never need it.
dependencies = [
    "numpy>=1.23",
    "pyzmq>=25",
    "pydantic>=2.5",
    "pyyaml>=6",
]

[project.optional-dependencies]
opencv = ["opencv-python-headless>=4.6"]
zstd = ["zstandard>=0.21"]
all = ["faistream[opencv,zstd]"]

[project.scripts]
faistream = "faistream.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
exclude = ["*.md"]  # keep hand-aligned comments in docs

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
