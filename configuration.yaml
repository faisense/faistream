data:
  num_workers: 4
  train_path: data/train
  val_path: data/val
logging:
  exp_name: exp1
  log_dir: logs
model:
  arch: resnet50
  input_shape:
  - 3
  - 224
  - 224
  pretrained: true
seed: 42
training:
  batch_size: 32
  epochs: 20
  loss_fun: CROSS_ENTROPY
  lr: 0.001
  optimizer: ADAM
  weight_decay: 0.0001
